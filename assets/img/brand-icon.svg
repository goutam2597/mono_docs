<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <!-- MONO marketplace mark: a minimal shopping bag whose front face
       carries an "M" monogram formed by a single continuous stroke. -->
  <defs>
    <linearGradient id="monoBag" x1="230" y1="250" x2="770" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>

  <!-- Bag handle -->
  <path d="M360 300v-24c0-77 63-140 140-140s140 63 140 140v24"
        stroke="#171717" stroke-width="46" stroke-linecap="round"/>

  <!-- Bag body -->
  <path d="M258 300h484c30 0 55 23 58 53l44 430c4 43-29 80-72 80H228c-43 0-76-37-72-80l44-430c3-30 28-53 58-53Z"
        fill="url(#monoBag)"/>

  <!-- M monogram -->
  <path d="M350 620V470l150 120 150-120v150"
        stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Accent dot -->
  <circle cx="500" cy="712" r="26" fill="#fdc040"/>
</svg>
